name: "Lint PR: Conventional Commits"

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  main:
    name: Validate Conventional Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Define which types are allowed (Standard CC types)
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
          # We leave subjectPattern blank here because Jira is handled elsewhere
          # This ensures the format is "type(scope): description"
          headerPattern: '^(\w*)(?:\(([\w\$\.\-\* ]*)\))?\s*:\s*(.*)$'